<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zwift Coach Plan</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🚴%3C/text%3E%3C/svg%3E">
<style>
:root{
  --bg:#f6f7f8;--surface:#fff;--sunken:#eef0f2;--ink:#16191d;--ink2:#4c545d;--ink3:#6c747d;--line:#dde1e5;--accent:#c7480f;--ok:#14764d;--warn:#8a5a00;
  --z1:#7d8794;--z2:#2f7fd1;--z3:#1f9d68;--z4:#d39e00;--z5:#e8702a;--z6:#d13f3f;--z7:#8e44ad;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111316;--surface:#1a1d21;--sunken:#24282d;--ink:#f0f2f4;--ink2:#b7bec6;--ink3:#969ea7;--line:#30353b;--accent:#ff8a4f;--ok:#58c797;--warn:#e3b528;
  --z1:#9aa3af;--z2:#5aa2e8;--z3:#3fbf88;--z4:#e3b528;--z5:#f08a4b;--z6:#ec6464;--z7:#b57fd0;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#111316;--surface:#1a1d21;--sunken:#24282d;--ink:#f0f2f4;--ink2:#b7bec6;--ink3:#969ea7;--line:#30353b;--accent:#ff8a4f;--ok:#58c797;--warn:#e3b528;
  --z1:#9aa3af;--z2:#5aa2e8;--z3:#3fbf88;--z4:#e3b528;--z5:#f08a4b;--z6:#ec6464;--z7:#b57fd0;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:1040px;margin:0 auto;padding:28px 16px 64px}
h1{font-size:26px;line-height:1.2;margin:0}
h2{font-size:17px;margin:0 0 12px}
.sub{color:var(--ink2);margin:4px 0 0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;margin-top:18px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.between{justify-content:space-between}
.eyebrow{color:var(--accent);font-weight:600;font-size:13px}
.next-name{font-size:22px;font-weight:650;line-height:1.25;margin:2px 0}
.meta{color:var(--ink2);font-size:14px;font-variant-numeric:tabular-nums}
.note{color:var(--ink2);margin:10px 0 0}
input[type=search],select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-height:40px}
input[type=search]{flex:1 1 220px;min-width:0}
button{font:inherit;color:var(--ink);cursor:pointer}
.chip{background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:6px 12px;min-height:36px}
.chip[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.btn{background:var(--sunken);border:1px solid var(--line);border-radius:8px;padding:7px 12px;min-height:36px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.month{margin-top:18px}
.month:first-child{margin-top:0}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.dow{color:var(--ink3);font-size:12px;padding:0 6px 2px}
.cell{min-height:84px;border-radius:8px;background:var(--sunken);padding:5px 6px;font-size:12px;color:var(--ink3);display:flex;flex-direction:column;gap:3px;min-width:0}
.cell.blank{background:none}
.cell.today{box-shadow:inset 0 0 0 2px var(--accent)}
.card{all:unset;box-sizing:border-box;cursor:pointer;display:block;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--c);border-radius:6px;padding:3px 6px;color:var(--ink);overflow:hidden}
.card:hover{background:var(--bg)}
.card:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.card b{display:block;font-weight:600;font-size:12px;line-height:1.25}
.card span{color:var(--ink2);font-size:11px}
.card.dim{opacity:.28}
.agenda{display:none;list-style:none;margin:0;padding:0}
.agenda li{margin-top:6px}
.agenda .card{padding:8px 10px;width:100%}
.agenda .card b{font-size:14px}
.agenda .card span{font-size:13px}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.table-wrap{overflow-x:auto}
th,td{text-align:left;padding:8px 10px 8px 0;border-top:1px solid var(--line);white-space:nowrap;vertical-align:middle}
th{border-top:0;color:var(--ink3);font-size:12px;font-weight:600}
.num{text-align:right}
.bar{display:inline-block;width:90px;height:6px;background:var(--sunken);border-radius:3px;overflow:hidden;vertical-align:middle;margin-left:8px}
.bar i{display:block;height:100%;background:var(--ink3)}
.good{color:var(--ok)}
.light{color:var(--warn)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--ink2);margin-top:10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
svg{display:block;width:100%;height:auto;overflow:visible}
svg text{fill:var(--ink3);font:12px system-ui,sans-serif}
.tip{position:fixed;z-index:20;pointer-events:none;background:var(--ink);color:var(--surface);border-radius:6px;padding:4px 8px;font-size:12px;display:none;white-space:nowrap}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);padding:20px;width:min(640px,calc(100vw - 32px));max-height:calc(100dvh - 40px)}
dialog::backdrop{background:rgba(0,0,0,.45)}
pre{background:var(--sunken);border-radius:8px;padding:10px 12px;font-size:13px;overflow-x:auto;margin:10px 0}
.empty{color:var(--ink2)}
@media (max-width:680px){
  .grid-wrap{display:none}
  .agenda{display:block}
}
</style>
</head>
<body>
<main>
  <header class="row between">
    <div>
      <h1>Zwift Coach Plan</h1>
      <p class="sub" id="sub"></p>
    </div>
  </header>

  <section class="panel" id="next" aria-label="Next ride"></section>

  <section class="panel" aria-label="Find workouts">
    <div class="row">
      <input id="q" type="search" placeholder="Search: vo2, threshold, 2026-12, ramp" aria-label="Search workouts">
      <select id="status" aria-label="Status">
        <option value="">Planned and done</option>
        <option value="planned">Planned</option>
        <option value="done">Done</option>
      </select>
    </div>
    <div class="row" id="types" style="margin-top:10px"></div>
    <p class="meta" id="count" style="margin:10px 0 14px"></p>
    <div class="grid-wrap" id="calendar"></div>
    <ul class="agenda" id="agenda"></ul>
  </section>

  <section class="panel">
    <h2>Weekly targets</h2>
    <div class="table-wrap"><table id="weeks"></table></div>
    <p class="note" id="weeks-note"></p>
  </section>

  <section class="panel" id="form-panel">
    <h2>Fitness and fatigue</h2>
    <div id="form"></div>
  </section>

  <section class="panel">
    <h2>Power zones</h2>
    <div class="legend" id="zones"></div>
  </section>
</main>
<dialog id="detail"></dialog>
<div class="tip" id="tip" role="status"></div>

<script>
const TYPES = {
  vo2max: {label: 'VO2max', color: 'var(--z5)'},
  threshold: {label: 'Threshold', color: 'var(--z4)'},
  'sweet-spot': {label: 'Sweet spot', color: 'var(--z3)'},
  endurance: {label: 'Endurance', color: 'var(--z2)'},
  test: {label: 'Ramp test', color: 'var(--z6)'},
};
const ZONE_TOPS = [55, 75, 90, 105, 120, 150];
const ZONE_NAMES = ['Recovery', 'Endurance', 'Tempo', 'Threshold', 'VO2max', 'Anaerobic', 'Sprint'];
const NS = 'http://www.w3.org/2000/svg';
const $ = id => document.getElementById(id);
const state = {q: '', type: '', status: ''};
let DATA;

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}
function svgEl(tag, attrs, text) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (text != null) e.textContent = text;
  return e;
}
function parse(iso) { const [y, m, d] = iso.split('-').map(Number); return new Date(y, m - 1, d); }
function iso(d) { return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; }
function monday(d) { const x = new Date(d); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); return x; }
function longDate(s) { return parse(s).toLocaleDateString('en-GB', {weekday: 'short', day: 'numeric', month: 'short'}); }
function zoneOf(pct) { const i = ZONE_TOPS.findIndex(t => pct <= t); return i < 0 ? 7 : i + 1; }
function watts(pct) { return Math.round(pct * DATA.athlete.ftp / 100); }
function typeOf(e) { return TYPES[e.type] || TYPES.endurance; }
function dur(sec) { return sec % 60 ? `${Math.floor(sec / 60)}:${String(sec % 60).padStart(2, '0')}` : `${sec / 60} min`; }

function showTip(text, x, y) {
  const t = $('tip');
  t.textContent = text;
  t.style.display = 'block';
  const w = t.offsetWidth;
  t.style.left = Math.max(8, Math.min(innerWidth - w - 8, x - w / 2)) + 'px';
  t.style.top = Math.max(8, y - 38) + 'px';
}
function hideTip() { $('tip').style.display = 'none'; }

function profile(event) {
  const W = 600, H = 130, steps = event.steps || [];
  const svg = svgEl('svg', {viewBox: `0 0 ${W} ${H}`, role: 'img',
    'aria-label': `Power profile for ${event.name}, ${event.minutes} minutes`});
  if (!steps.length) return svg;
  const total = steps.reduce((a, s) => a + s[0], 0);
  const top = Math.max(125, ...steps.map(s => Math.max(s[1], s[2]))) * 1.05;
  const y = p => H - 16 - (p / top) * (H - 24);
  const ftpY = y(100);
  let t = 0;
  const spans = [];
  for (const [sec, a, b] of steps) {
    const x0 = t / total * W, x1 = (t + sec) / total * W;
    spans.push({t0: t, t1: t + sec, a, b});
    // Ramps are cut into slices so each slice wears the zone it is in.
    const slices = a === b ? 1 : Math.max(2, Math.round(sec / 30));
    for (let i = 0; i < slices; i++) {
      const pa = a + (b - a) * i / slices, pb = a + (b - a) * (i + 1) / slices;
      const xa = x0 + (x1 - x0) * i / slices, xb = x0 + (x1 - x0) * (i + 1) / slices;
      const gap = i === slices - 1 && xb - xa > 3 ? 1 : 0;
      svg.append(svgEl('polygon', {
        points: `${xa},${H - 16} ${xa},${y(pa)} ${xb - gap},${y(pb)} ${xb - gap},${H - 16}`,
        fill: `var(--z${zoneOf((pa + pb) / 2)})`,
      }));
    }
    t += sec;
  }
  svg.append(svgEl('line', {x1: 0, x2: W, y1: ftpY, y2: ftpY, stroke: 'var(--ink3)', 'stroke-dasharray': '4 4'}));
  svg.append(svgEl('text', {x: 2, y: ftpY - 4}, `FTP ${DATA.athlete.ftp} W`));
  svg.append(svgEl('text', {x: W, y: H - 2, 'text-anchor': 'end'}, `${event.minutes} min`));
  svg.append(svgEl('text', {x: 0, y: H - 2}, '0'));
  const hit = svgEl('rect', {x: 0, y: 0, width: W, height: H, fill: 'transparent'});
  hit.addEventListener('pointermove', ev => {
    const box = svg.getBoundingClientRect();
    const at = (ev.clientX - box.left) / box.width * total;
    const s = spans.find(sp => at >= sp.t0 && at < sp.t1) || spans[spans.length - 1];
    const f = s.a === s.b ? 0 : (at - s.t0) / (s.t1 - s.t0);
    const pct = s.a + (s.b - s.a) * f;
    const range = s.a === s.b ? `${watts(s.a)} W, ${s.a}%` : `${watts(s.a)}-${watts(s.b)} W ramp`;
    showTip(`Z${zoneOf(pct)} · ${range} · ${dur(s.t1 - s.t0)}`, ev.clientX, ev.clientY);
  });
  hit.addEventListener('pointerleave', hideTip);
  svg.append(hit);
  return svg;
}

function summary(e) {
  const hr = e.hr ? ` · ${e.hr} bpm` : '';
  const power = e.watts ? ` · ${e.watts}` : '';
  return `${e.minutes} min · ${e.tss} TSS${power}${hr}`;
}

function openDetail(e) {
  const d = $('detail');
  d.replaceChildren();
  const head = el('div', 'row between');
  const title = el('div');
  title.append(el('div', 'eyebrow', `${longDate(e.date)} · ${e.phase || ''}${e.status === 'done' ? ' · Done' : ''}`));
  title.append(el('div', 'next-name', e.name));
  title.append(el('div', 'meta', summary(e)));
  const close = el('button', 'btn', 'Close');
  close.onclick = () => d.close();
  head.append(title, close);
  d.append(head);
  if (e.steps) { const wrap = el('div'); wrap.style.marginTop = '12px'; wrap.append(profile(e)); d.append(wrap); }
  if (e.notes) d.append(el('p', 'note', e.notes));
  if (e.text) {
    d.append(el('pre', null, e.text));
    const copy = el('button', 'btn', 'Copy workout');
    copy.onclick = async () => {
      try { await navigator.clipboard.writeText(e.text); copy.textContent = 'Copied'; }
      catch { copy.textContent = 'Copy failed'; }
    };
    d.append(copy);
  }
  d.showModal();
}

function matches(e) {
  if (state.type && e.type !== state.type) return false;
  if (state.status && e.status !== state.status) return false;
  if (!state.q) return true;
  const hay = `${e.name} ${e.type} ${e.phase || ''} ${e.date} ${longDate(e.date)} ${e.notes || ''}`.toLowerCase();
  return state.q.toLowerCase().split(/\s+/).every(w => hay.includes(w));
}

function card(e, on) {
  const b = el('button', 'card' + (on ? '' : ' dim'));
  b.style.setProperty('--c', typeOf(e).color);
  b.append(el('b', null, e.name));
  b.append(el('span', null, `${e.minutes} min${e.status === 'done' ? ' · Done' : ''}`));
  b.setAttribute('aria-label', `${longDate(e.date)}: ${e.name}, ${e.minutes} minutes, ${e.status}`);
  b.onclick = () => openDetail(e);
  return b;
}

function renderCalendar() {
  const events = DATA.events;
  const shown = events.filter(matches);
  $('count').textContent = `${shown.length} of ${events.length} workouts`;
  const today = iso(new Date());
  const byDate = {};
  for (const e of events) (byDate[e.date] = byDate[e.date] || []).push(e);
  const cal = $('calendar');
  cal.replaceChildren();
  const months = [...new Set(events.map(e => e.date.slice(0, 7)))].sort();
  for (const m of months) {
    const box = el('div', 'month');
    const [y, mo] = m.split('-').map(Number);
    box.append(el('h2', null, new Date(y, mo - 1, 1).toLocaleDateString('en-GB', {month: 'long', year: 'numeric'})));
    const grid = el('div', 'grid');
    for (const d of ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun']) grid.append(el('div', 'dow', d));
    const first = new Date(y, mo - 1, 1);
    for (let i = 0; i < (first.getDay() + 6) % 7; i++) grid.append(el('div', 'cell blank'));
    for (let d = first; d.getMonth() === mo - 1; d = new Date(y, mo - 1, d.getDate() + 1)) {
      const key = iso(d);
      const cell = el('div', 'cell' + (key === today ? ' today' : ''));
      cell.append(el('span', null, d.getDate()));
      for (const e of byDate[key] || []) cell.append(card(e, shown.includes(e)));
      grid.append(cell);
    }
    box.append(grid);
    cal.append(box);
  }
  const agenda = $('agenda');
  agenda.replaceChildren();
  for (const e of shown) {
    const li = el('li');
    li.append(el('div', 'meta', longDate(e.date)), card(e, true));
    agenda.append(li);
  }
  if (!shown.length) agenda.append(el('li', 'empty', 'No workouts match.'));
}

function renderNext() {
  const box = $('next');
  const today = iso(new Date());
  const next = DATA.events.find(e => e.status === 'planned' && e.date >= today);
  box.replaceChildren();
  if (!next) { box.append(el('p', 'empty', 'No upcoming rides in this plan.')); return; }
  const when = next.date === today ? 'Today' : `Next ride · ${longDate(next.date)}`;
  const top = el('div', 'row between');
  const left = el('div');
  left.append(el('div', 'eyebrow', when), el('div', 'next-name', next.name), el('div', 'meta', summary(next)));
  const open = el('button', 'btn', 'See workout');
  open.onclick = () => openDetail(next);
  top.append(left, open);
  const chart = el('div');
  chart.style.marginTop = '12px';
  chart.append(profile(next));
  box.append(top, chart);
  if (next.notes) box.append(el('p', 'note', next.notes));
}

function renderWeeks() {
  const t = DATA.athlete.targets;
  const table = $('weeks');
  table.replaceChildren();
  const head = el('tr');
  for (const [h, c] of [['Week of'], ['Phase'], [`Z2-3 min (goal ${t.z2_z3_min})`], [`Z4-5 min (goal ${t.z4_z5_min}+)`], ['Time', 'num'], ['TSS', 'num'], ['Status']]) head.append(el('th', c, h));
  table.append(head);
  for (const w of DATA.weeks) {
    const start = parse(w.monday), end = new Date(start); end.setDate(end.getDate() + 7);
    const rides = DATA.events.filter(e => { const d = parse(e.date); return d >= start && d < end; });
    const z23 = Math.round(rides.reduce((a, e) => a + (e.z23 || 0), 0));
    const z45 = Math.round(rides.reduce((a, e) => a + (e.z45 || 0), 0));
    const mins = rides.reduce((a, e) => a + (e.minutes || 0), 0);
    const tss = rides.reduce((a, e) => a + (e.tss || 0), 0);
    const hit = z23 >= t.z2_z3_min && z45 >= t.z4_z5_min;
    const tr = el('tr');
    tr.append(el('td', null, start.toLocaleDateString('en-GB', {day: 'numeric', month: 'short'})), el('td', null, w.phase));
    for (const [v, goal] of [[z23, t.z2_z3_min], [z45, Math.max(t.z4_z5_min, 30)]]) {
      const td = el('td', null, v);
      const bar = el('span', 'bar'), fill = el('i');
      fill.style.width = Math.min(100, v / goal * 100) + '%';
      bar.append(fill);
      td.append(bar);
      tr.append(td);
    }
    tr.append(el('td', 'num', `${Math.floor(mins / 60)}h ${String(mins % 60).padStart(2, '0')}`), el('td', 'num', tss));
    tr.append(el('td', hit ? 'good' : 'light', hit ? '✓ On target' : `Lighter: ${w.phase}`));
    table.append(tr);
  }
  $('weeks-note').textContent = 'Recovery and retest weeks sit below the zone 2-3 goal on purpose, so fitness can absorb the build weeks.';
}

function renderForm() {
  const box = $('form');
  box.replaceChildren();
  const days = DATA.form && DATA.form.days;
  if (!days || !days.length) { box.append(el('p', 'empty', 'Fitness and fatigue appear here once Intervals.icu history is synced.')); return; }
  const W = 800, H = 220, L = 34, B = 22;
  const svg = svgEl('svg', {viewBox: `0 0 ${W} ${H}`, role: 'img', 'aria-label': 'Fitness and fatigue over time'});
  const vals = days.flatMap(d => [d[1], d[2]]);
  const max = Math.ceil(Math.max(...vals, 10) / 10) * 10;
  const x = i => L + i / Math.max(1, days.length - 1) * (W - L - 8);
  const y = v => (H - B) - v / max * (H - B - 8);
  for (let v = 0; v <= max; v += max / 4) {
    svg.append(svgEl('line', {x1: L, x2: W - 8, y1: y(v), y2: y(v), stroke: 'var(--line)'}));
    svg.append(svgEl('text', {x: L - 6, y: y(v) + 4, 'text-anchor': 'end'}, Math.round(v)));
  }
  [[1, 'var(--z2)'], [2, 'var(--z5)']].forEach(([k, color]) => {
    svg.append(svgEl('path', {d: days.map((d, i) => `${i ? 'L' : 'M'}${x(i)} ${y(d[k])}`).join(''), fill: 'none', stroke: color, 'stroke-width': 2, 'stroke-linejoin': 'round'}));
  });
  svg.append(svgEl('text', {x: L, y: H - 4}, longDate(days[0][0])));
  svg.append(svgEl('text', {x: W - 8, y: H - 4, 'text-anchor': 'end'}, longDate(days[days.length - 1][0])));
  const cross = svgEl('line', {y1: 8, y2: H - B, stroke: 'var(--ink3)', visibility: 'hidden'});
  svg.append(cross);
  const hit = svgEl('rect', {x: L, y: 0, width: W - L - 8, height: H, fill: 'transparent'});
  hit.addEventListener('pointermove', ev => {
    const r = svg.getBoundingClientRect();
    const i = Math.max(0, Math.min(days.length - 1, Math.round(((ev.clientX - r.left) / r.width * W - L) / (W - L - 8) * (days.length - 1))));
    cross.setAttribute('x1', x(i)); cross.setAttribute('x2', x(i)); cross.setAttribute('visibility', 'visible');
    showTip(`${longDate(days[i][0])} · Fitness ${days[i][1]} · Fatigue ${days[i][2]}`, ev.clientX, ev.clientY);
  });
  hit.addEventListener('pointerleave', () => { hideTip(); cross.setAttribute('visibility', 'hidden'); });
  svg.append(hit);
  box.append(svg);
  const legend = el('div', 'legend');
  for (const [name, color] of [['Fitness (CTL)', 'var(--z2)'], ['Fatigue (ATL)', 'var(--z5)']]) {
    const s = el('span'), i = el('i');
    i.style.background = color;
    s.append(i, name);
    legend.append(s);
  }
  box.append(legend);
}

function renderZones() {
  const box = $('zones');
  box.replaceChildren();
  ZONE_NAMES.forEach((name, i) => {
    const lo = i ? ZONE_TOPS[i - 1] + 1 : 0, hi = ZONE_TOPS[i];
    const range = hi ? `${watts(lo)}-${watts(hi)} W` : `${watts(lo)}+ W`;
    const s = el('span'), sw = el('i');
    sw.style.background = `var(--z${i + 1})`;
    s.append(sw, `Z${i + 1} ${name} ${range}`);
    box.append(s);
  });
}

function renderTypes() {
  const box = $('types');
  box.replaceChildren();
  const present = new Set(DATA.events.map(e => e.type));
  const opts = [['', 'All'], ...Object.keys(TYPES).filter(k => present.has(k)).map(k => [k, TYPES[k].label])];
  for (const [value, label] of opts) {
    const b = el('button', 'chip', label);
    b.setAttribute('aria-pressed', String(state.type === value));
    b.onclick = () => { state.type = value; renderTypes(); renderCalendar(); };
    box.append(b);
  }
}

async function load() {
  try {
    const res = await fetch('data.json?' + Date.now(), {cache: 'no-store'});
    if (!res.ok) throw new Error(res.status);
    DATA = await res.json();
  } catch (err) {
    $('next').replaceChildren(el('p', 'empty', 'Could not load the plan (data.json).'));
    return;
  }
  const updated = new Date(DATA.updatedAt).toLocaleDateString('en-GB', {day: 'numeric', month: 'short', year: 'numeric'});
  $('sub').textContent = `FTP ${DATA.athlete.ftp} W · Max HR ${DATA.athlete.maxHr} bpm · Updated ${updated}`;
  renderNext(); renderTypes(); renderCalendar(); renderWeeks(); renderForm(); renderZones();
}
$('q').addEventListener('input', ev => { state.q = ev.target.value.trim(); renderCalendar(); });
$('status').addEventListener('change', ev => { state.status = ev.target.value; renderCalendar(); });
$('detail').addEventListener('click', ev => { if (ev.target === $('detail')) $('detail').close(); });
load();
</script>
</body>
</html>
